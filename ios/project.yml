# XcodeGen spec for the iOS shell. The generated CookingBeEasy.xcodeproj is
# committed too, so you only need this if you are changing the project itself:
#
#     brew install xcodegen && (cd ios && xcodegen generate)

name: CookingBeEasy

options:
  bundleIdPrefix: com.clarivore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  CookingBeEasy:
    type: application
    platform: iOS
    sources:
      - path: CookingBeEasy
    settings:
      base:
        PRODUCT_NAME: CookingBeEasy
        PRODUCT_BUNDLE_IDENTIFIER: com.clarivore.cookingbeeasy
        INFOPLIST_FILE: CookingBeEasy/Info.plist
        # iPhone only — that is the whole point of the thing.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Brand
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 82WADWVR5Y
        ENABLE_USER_SCRIPT_SANDBOXING: YES
